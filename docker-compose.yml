version: '3.9'

# Database: Neon (external — no local postgres container needed)
# Frontend: Vercel (external — no web container needed in prod)
# This compose file runs the API + Redis for local development

services:
  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lawsphere-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── API ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
      target: builder
    container_name: lawsphere-api
    restart: unless-stopped
    # Runs migrations against Neon on startup, then starts the server
    command: sh -c "npx prisma migrate deploy --schema packages/database/prisma/schema.prisma && node apps/api/dist/main.js"
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      # DATABASE_URL and DATABASE_URL_UNPOOLED come from .env (Neon)
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules

  # ─── Nginx (API reverse proxy — production only) ─────────────
  nginx:
    image: nginx:alpine
    container_name: lawsphere-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/ssl/certs:ro
    depends_on:
      - api
    profiles:
      - production

networks:
  default:
    name: lawsphere-network
